name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - uses: actions/checkout@v4
      - run: go test ./...
      - run: go vet ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node internal/web/static/app.test.mjs
