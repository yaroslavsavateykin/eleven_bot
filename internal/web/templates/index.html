{{define "index"}}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8efeb">
  <title>{{.Name}} · Расписание</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main data-timezone="{{.TZ}}">
  <header>
    <h1>{{.Name}}</h1>
    <div class="clock-wrap" title="Часовой пояс: {{.TZ}}"><time id="clock"></time><time id="today-date"></time></div>
  </header>
  <h2 id="schedule-title" class="sr-only">Расписание</h2>
  <div class="period-controls">
    <nav class="period-bar" aria-label="Выбор периода" aria-describedby="period-title">
      <button id="previous" aria-label="Предыдущая" title="Предыдущая" aria-controls="schedule"><span aria-hidden="true">←</span></button>
      <div id="view" aria-label="Вид расписания" role="group" aria-describedby="period-title">
        <button type="button" data-view="week" aria-controls="schedule" aria-pressed="true">Неделя</button>
        <button type="button" data-view="month" aria-controls="schedule" aria-pressed="false">Месяц</button>
      </div>
      <button id="next" aria-label="Следующая" title="Следующая" aria-controls="schedule"><span aria-hidden="true">→</span></button>
     </nav>
    <h3 id="period-title"></h3>
   </div>
  <p id="feedback" class="sr-only" role="status" aria-live="polite"></p>
  <div id="error" role="alert"></div>
  <div id="schedule" aria-labelledby="schedule-title period-title" aria-busy="true">
    <div class="calendar"><div id="weekdays" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div id="dates" role="group" aria-label="Выбор даты"></div></div>
    <section id="agenda" class="day" aria-labelledby="agenda-title"></section>
  </div>
  <noscript><p>Для загрузки расписания включите JavaScript.</p></noscript>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>{{end}}
